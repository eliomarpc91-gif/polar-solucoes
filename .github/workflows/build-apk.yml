name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
      - name: Instalar imagemagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Limpar metadados dos PNGs
        run: |
          find assets -name "*.png" -exec mogrify -strip {} \; 2>/dev/null || true
          find assets -name "*.png" -exec sh -c 'convert "$1" "$1.tmp" && mv "$1.tmp" "$1"' _ {} \; 2>/dev/null || true
      - name: Permissao scripts
        run: chmod +x scripts/*.js || true
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean
      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Re-limpar PNGs gerados
        run: |
          find android/app/src/main/res -name "*.png" -exec mogrify -strip {} \; 2>/dev/null || true
          find android/app/build/generated -name "*.png" -exec mogrify -strip {} \; 2>/dev/null || true
      - name: Permissao gradlew
        run: chmod +x android/gradlew
      - name: Compilar APK Release
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Pandroid.enablePngCrunchInReleaseBuilds=false
      - name: Renomear APK
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          ls -la
          mv app-release.apk polar-solucoes-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polar-solucoes-apk
          path: frontend/android/app/build/outputs/apk/release/polar-solucoes-*.apk
          retention-days: 30
